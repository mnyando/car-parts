<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Car Parts - Static Landing</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ775/6b6QZsFQTJ0h3QZJpG5F86dIHNDz0W1" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
    <style>
      /* small override so static page looks like dynamic version */
      body { padding: 1rem; }
      .carousel { margin: 1.25rem auto 2rem; max-width: 1200px; }
    </style>
  </head>
  <body>

    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
      <ol class="carousel-indicators">
        <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
        <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
        <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
      </ol>
      <div class="carousel-inner" role="listbox">
        <div class="carousel-item active">
          <img class="d-block w-100 carousel-img" src="/static/images/slide1.jpg" alt="First slide" onerror="this.src='https://picsum.photos/1200/500?random=1'">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="display-4">Car Parts</h2>
            <p class="lead">Quality parts for your ride</p>
            <a href="/catalog" class="btn btn-outline-light">Shop Now</a>
          </div>
        </div>

        <div class="carousel-item">
          <img class="d-block w-100 carousel-img" src="/static/images/slide2.jpg" alt="Second slide" onerror="this.src='https://picsum.photos/1200/500?random=2'">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="display-4">Reliable</h2>
            <p class="lead">Durable and tested</p>
            <a href="/catalog" class="btn btn-outline-light">Browse</a>
          </div>
        </div>

        <div class="carousel-item">
          <img class="d-block w-100 carousel-img" src="/static/images/slide3.jpg" alt="Third slide" onerror="this.src='https://picsum.photos/1200/500?random=3'">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="display-4">Fast Delivery</h2>
            <p class="lead">Get parts to your door quickly</p>
            <a href="/catalog" class="btn btn-outline-light">Get Started</a>
          </div>
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>

    <footer class="text-center mt-4 mb-4">
      <div class="container">
        <small>© 2025 Car Parts</small>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <script>
      // Ensure carousel initializes and auto-rotates; fallback if Bootstrap not available
      document.addEventListener('DOMContentLoaded', function () {
        var el = document.querySelector('#carouselExampleIndicators');
        if (el) {
          if (typeof jQuery !== 'undefined') {
            jQuery(el).carousel({ interval: 4000 });
          } else if (typeof bootstrap !== 'undefined' && bootstrap.Carousel) {
            new bootstrap.Carousel(el, { interval: 4000 });
          } else {
            // Manual fallback: rotate slides by toggling display
            var items = el.querySelectorAll('.carousel-item');
            if (items.length > 1) {
              var idx = 0;
              items.forEach(function(it,i){ it.style.display = (i===0)?'block':'none'; });
              setInterval(function(){
                items[idx].style.display='none';
                idx = (idx+1) % items.length;
                items[idx].style.display='block';
              }, 4000);
            }
          }
        }
      });
    </script>
  </body>
</html>
