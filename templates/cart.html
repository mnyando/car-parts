{% extends 'base.html' %}

{% block head_extra %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% endblock %}

{% block content %}
  {% include 'navbar.html' %}

  <main class="main-container">
    <section class="section">
      <h2 class="section-title">Your Cart</h2>
      <div class="cart"></div>
      <div class="cart-footer">
        <h2 class="cart-footer-total" data-action="total-price">0</h2>
        <a class="btn btn-primary btn-small btn-danger" href="{{ url_for('catalog') }}">Continue Shopping</a>
      </div>
    </section>
  </main>

  {% include 'footer.html' %}

  <script src="{{ url_for('static', filename='cart.js') }}"></script>
{% endblock %}
