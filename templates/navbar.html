<header class="hdr">
  <div class="hdr__inner">
    <a class="hdr__logo" href="{{ url_for('index') }}">CARPARTS</a>
    <div class="hdr__right">
      <div class="hdr__lang" aria-label="Language">
        <button data-lang="en" class="is-active">EN</button>
        <span>/</span>
        <button data-lang="sw">SW</button>
      </div>
      {% if is_admin %}
      <a class="hdr__cart" href="{{ url_for('admin.dashboard') }}">Admin</a>
      {% endif %}
      {% if current_user %}
      <button class="hdr__cart" data-cart-open aria-label="Open cart">Cart (<span data-cart-count>0</span>)</button>
      {% else %}
      <a class="hdr__cart" href="{{ url_for('auth.login') }}">Log in</a>
      {% endif %}
      <button class="hdr__burger" data-menu-open aria-label="Open menu"><span></span><span></span></button>
    </div>
  </div>
</header>
