<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Car Parts - Catalog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Car Parts Catalog</h1>
  <p><a href="{{ url_for('cart') }}">View Cart</a></p>
  <div class="products">
    {% for p in products %}
      <div class="product">
        <img class="product-image" src="{{ url_for('static', filename='images/slide' ~ (loop.index % 3 + 1) ~ '.jpg') }}" alt="{{ p.name }}">
        <h3 class="product-name">{{ p.name }}</h3>
        <p class="product-price">${{ '%.2f'|format(p.price) }}</p>

        <div class="product-actions">
          <form action="/checkout" method="post" class="checkout-form">
            <input type="hidden" name="product_id" value="{{ p.id }}">
            <input type="text" name="phone" placeholder="2547XXXXXXXX" required>
            <button type="submit" class="btn btn-primary">Buy</button>
          </form>

          <button class="btn btn-outline-secondary" data-action="add-to-cart">Add To Cart</button>
        </div>
      </div>
    {% endfor %}
  </div>

  <script>
  document.querySelectorAll('.checkout-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const res = await fetch('/checkout', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
      const json = await res.json();
      if (res.ok) alert('Payment initiated. Order ID: ' + json.order_id);
      else alert('Error: ' + (json.error || 'unknown'));
    })
  })
  </script>

  <script src="{{ url_for('static', filename='cart.js') }}"></script>
</body>
</html>
