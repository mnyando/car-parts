{% extends 'admin/layout.html' %}

{% block admin_content %}
  <h1 class="admin__title">Orders</h1>
  <nav class="filter" aria-label="Filter by status">
    <a href="{{ url_for('admin.orders') }}" class="{{ 'is-active' if not status }}">All</a>
    {% for s in statuses %}
    <a href="{{ url_for('admin.orders', status=s) }}" class="{{ 'is-active' if status == s }}">{{ s.replace('_', ' ') }}</a>
    {% endfor %}
  </nav>
  {% set rows = orders %}
  {% include 'admin/_orders_table.html' %}
{% endblock %}
