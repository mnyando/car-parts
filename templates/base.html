<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Car Parts</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    {% include 'footer.html' %}

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
      // Fallback: if Bootstrap's carousel JS isn't available, do a simple manual rotation
      (function(){
        function manualCarousel(){
          var el = document.querySelector('#carouselExampleIndicators');
          if(!el) return;
          var items = el.querySelectorAll('.carousel-item');
          if(items.length <= 1) return;
          var idx = 0;
          items.forEach(function(it,i){ it.style.display = (i===0)?'block':'none'; });
          setInterval(function(){
            items[idx].style.display='none';
            idx = (idx+1) % items.length;
            items[idx].style.display='block';
          }, 4000);
        }
        // run after DOM ready
        document.addEventListener('DOMContentLoaded', manualCarousel);
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
