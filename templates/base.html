<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Car Parts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="drawer" data-menu aria-hidden="true">
      <button class="drawer__close" data-menu-close aria-label="Close menu">Close</button>
      <ul class="drawer__list">
        <li><a href="{{ url_for('index') }}">Home</a></li>
        <li><a href="{{ url_for('catalog') }}">Shop parts</a></li>
        <li><a href="{{ url_for('cart') }}">Cart</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="drawer__foot"><span>Nairobi</span><span>+254 700 000 000</span></div>
    </nav>

    <div class="cart-drawer" data-cart aria-hidden="true">
      <div class="cart-drawer__scrim" data-cart-close></div>
      <div class="cart-drawer__panel">
        <div class="cart-drawer__head">
          <h3>Your Cart</h3>
          <button class="cart-drawer__close" data-cart-close aria-label="Close cart">Close</button>
        </div>
        <div class="cart"></div>
      </div>
    </div>

    {% block content %}{% endblock %}
    {% include 'footer.html' %}

    <script defer src="{{ url_for('static', filename='js/interactions.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
